<line x1="0" x2="1200" y1="70" y2="70" stroke="#E4E7E2"/><text x="60" y="128" fill="#1F8F3A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" opacity="0">›<animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.01s" fill="freeze"/></text><text x="90" y="128" fill="#5F6662" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" clip-path="url(#c0)">agents will run most of the economy. I'm building the ones that do.</text><text x="60" y="178" fill="#1F8F3A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" opacity="0">›<animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.01s" fill="freeze"/></text><text x="90" y="178" fill="#5F6662" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" clip-path="url(#c1)">every market on-chain, open 24/7, readable by machines.</text><text x="60" y="228" fill="#1F8F3A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" opacity="0">›<animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.01s" fill="freeze"/></text><text x="90" y="228" fill="#5F6662" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" clip-path="url(#c2)">one founder with agents, the output of a thousand-person company.</text><text x="60" y="278" fill="#1F8F3A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" opacity="0">›<animate attributeName="opacity" from="0" to="1" begin="5.1s" dur="0.01s" fill="freeze"/></text><text x="90" y="278" fill="#0C0E0D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" clip-path="url(#c3)">not features. not side projects. category-defining companies.</text><rect x="90" y="304" width="12" height="26" fill="#1F8F3A" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="1s" begin="6.6s" repeatCount="indefinite"/></rect></svg>